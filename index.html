<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viva Lago | Mapa interactivo</title>
    <meta name="theme-color" content="#f8f4ec" />
    <meta name="apple-mobile-web-app-title" content="Viva Lago" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="%BASE_URL%images/viva-lago-app-icon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%images/viva-lago-app-icon.png" />
    <script>
      (function () {
        var locationSearch = window.location.search;
        if (!locationSearch || locationSearch[1] !== "/") {
          return;
        }

        var decodedPath = locationSearch
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          "",
          window.location.pathname.replace(/\/$/, "") + decodedPath + window.location.hash
        );
      })();
    </script>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
